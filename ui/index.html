<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizerAI Question Lab</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f27; --muted: #667085; --line: #e3e6eb;
    --accent: #3b5bdb; --accent-soft: #e8edff; --ok: #1a7f4b; --ok-soft: #e3f6ec;
    --bad: #c92a2a; --bad-soft: #fdeaea; --warn: #a15c00; --warn-soft: #fff3dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --card: #1b1e26; --text: #e8eaf0; --muted: #9aa3b2; --line: #2b303b;
      --accent: #8da2ff; --accent-soft: #232a46; --ok: #5fd39a; --ok-soft: #173325;
      --bad: #ff8a8a; --bad-soft: #3a1c1c; --warn: #ffc266; --warn-soft: #3a2d12;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* .demo sets display, which would otherwise override the hidden attribute */
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 18px 16px 0; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .demo { display: inline-block; background: var(--warn-soft); color: var(--warn); padding: 2px 8px; border-radius: 99px; font-size: 12px; margin-left: 8px; }
  nav { display: flex; gap: 4px; margin-top: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { background: none; border: 0; color: var(--muted); padding: 10px 14px; font: inherit; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav button.on { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  section { display: none; } section.on { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); min-width: 0; }
  input.grow { flex: 1; min-width: 200px; }
  button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: wait; }
  button.ghost { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--accent-soft); color: var(--accent); margin-right: 6px; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.fig { background: var(--warn-soft); color: var(--warn); }
  .q { white-space: pre-wrap; margin: 8px 0 4px; }
  .meta { color: var(--muted); font-size: 13px; }
  .fig-desc { background: var(--warn-soft); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 6px; white-space: pre-wrap; }
  .fig-svg { margin: 10px 0 4px; color: var(--text); }
  .fig-svg svg { max-width: 100%; height: auto; display: block; }
  .sol { background: var(--ok-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; font-size: 14px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .check { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .check:first-of-type { border-top: 0; }
  .check .name { width: 210px; } .check .res { flex: 1; font-size: 13px; color: var(--muted); word-break: break-word; }
  .step { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; margin: 0 0 14px; }
  .step h3 { margin: 0 0 4px; font-size: 14px; }
  .step.verify { border-color: var(--ok); } .step.generate { border-color: var(--warn); } .step.finalize { border-color: var(--ok); }
  .lang { display: flex; gap: 6px; margin: 0 0 12px; }
  .lang button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .err { color: var(--bad); background: var(--bad-soft); padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; }
  .muted { color: var(--muted); }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  @media (max-width: 560px) { .kv { grid-template-columns: 1fr; } .check { flex-wrap: wrap; } .check .name { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>QuizerAI Question Lab <span id="demoBadge" class="demo" hidden>DEMO · fake AWS</span></h1>
  <div class="sub">Check connections, search the question bank, generate new questions, inspect the vector index.</div>
  <nav id="nav">
    <button data-tab="status" class="on">Status</button>
    <button data-tab="search">Search</button>
    <button data-tab="generate">Generate</button>
    <button data-tab="index">Vector index</button>
  </nav>
</header>
<main>

<section id="status" class="on">
  <div class="card"><div class="kv" id="cfg"></div></div>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <strong>Connection checks</strong><button class="ghost" id="runChecks">Run all checks</button>
    </div>
    <div id="checks"></div>
    <div class="meta" style="margin-top:8px">Each check makes one real AWS call. On a slow network a check can take up to a minute.</div>
  </div>
</section>

<section id="search">
  <div class="card">
    <div class="row">
      <label class="grow" style="flex:1">Search the question bank<input class="grow" id="sq" placeholder="e.g. tangent to a circle, find the angle"></label>
      <label>Results<input id="sk" type="number" min="1" max="30" value="5" style="width:80px"></label>
      <label>Type<select id="st"><option value="">any</option><option>mcq</option><option>assertion_reason</option><option>very_short_answer</option><option>short_answer</option><option>long_answer</option><option>case_study</option></select></label>
      <button class="primary" id="sgo">Search</button>
    </div>
  </div>
  <div id="sres"></div>
</section>

<section id="generate">
  <div class="card">
    <div class="row">
      <label style="flex:1">Topic<input class="grow" id="gt" placeholder="e.g. Heights and distances"></label>
      <label>How many<input id="gn" type="number" min="1" max="10" value="3" style="width:80px"></label>
      <label>Type<select id="gy"><option value="">same as examples</option><option>mcq</option><option>assertion_reason</option><option>very_short_answer</option><option>short_answer</option><option>long_answer</option><option>case_study</option></select></label>
      <button class="primary" id="ggo">Generate</button>
    </div>
    <label style="flex-direction:row;align-items:center;gap:8px;margin-top:10px;color:var(--text);font-size:14px">
      <input type="checkbox" id="gf"> Diagram questions (up to 3 tries each; if a try fails, a text question is made instead)</label>
  </div>
  <div id="gstatus" class="meta"></div>
  <div id="gsteps"></div>
  <div id="gfinal"></div>
</section>

<section id="index">
  <div class="card row" style="align-items:center">
    <button class="primary" id="iaws">Load from vector DB (AWS)</button>
    <button class="ghost" id="iloc">Show questions.json (local file)</button>
    <span class="meta" id="icount"></span>
  </div>
  <div id="ires"></div>
</section>

</main>
<script>
const $ = s => document.querySelector(s);
// Render any \( ... \) or \[ ... \] maths that the model wrote, if KaTeX loaded (the page still works without it).
function renderMath(el) {
  if (window.renderMathInElement) renderMathInElement(el, {throwOnError: false, delimiters: [
    {left: "\\(", right: "\\)", display: false}, {left: "\\[", right: "\\]", display: true}]});
}
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let lang = "en";

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === b.dataset.tab));
});

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

// A question as shown everywhere; `q` may come from search, generation, index or file.
function qCard(q, extra = "") {
  const text = lang === "hi" ? (q.question_info_hindi || q.question_info) : q.question_info;
  const topic = lang === "hi" ? (q.topic_hindi || q.topic) : q.topic;
  const sub = lang === "hi" ? (q.subtopic_hindi || q.subtopic) : q.subtopic;
  // diagram_svg is drawn by our own renderer (diagram.py) from numbers and escaped labels, so it is safe to insert
  const svg = q.diagram_svg ? `<div class="fig-svg">${q.diagram_svg}</div>` : "";
  const fig = q.image_description ? (q.diagram_svg
    ? `<details><summary>figure description</summary><div class="fig-desc">${esc(q.image_description)}</div></details>`
    : `<div class="fig-desc"><b>Figure:</b> ${esc(q.image_description)}</div>`) : "";
  const sol = q.answer ? `<div class="sol"><b>Answer:</b> ${esc(q.answer)}\n${esc(q.solution || "")}</div>` : "";
  return `<div class="card">${extra}
    <div><span class="chip">${esc(q.question_type)}</span>${q.diagram_svg ? '<span class="chip fig">AI diagram</span>' : q.image_description ? '<span class="chip fig">has figure</span>' : ""}
    <span class="meta">${esc(topic)} › ${esc(sub)}</span></div>
    <div class="q">${esc(text)}</div>${svg}${q.diagram_error ? `<div class="err" style="margin-top:6px;font-size:13px">Figure rejected by the geometry check: ${esc(q.diagram_error)}</div>` : ""}${fig}${sol}</div>`;
}
function langBar(redraw) {
  const d = document.createElement("div"); d.className = "lang";
  d.innerHTML = `<button class="ghost ${lang==="en"?"on":""}" data-l="en">English</button><button class="ghost ${lang==="hi"?"on":""}" data-l="hi">हिन्दी</button>`;
  d.querySelectorAll("button").forEach(b => b.onclick = () => { lang = b.dataset.l; redraw(); });
  return d;
}

// ---------- status
async function loadCfg() {
  const c = await api("/api/config");
  $("#demoBadge").hidden = !c.demo;
  $("#cfg").innerHTML = [
    ["Region", c.region], ["Vector bucket / index", `${c.bucket} / ${c.index}`],
    ["Embedding model", `${c.embed_model} (${c.dimensions} dims)`], ["Question writer", c.llm_model],
    ["Question checker", c.judge_model], ["Figure builder", c.diagram_model], ["Search results used", c.top_k],
  ].map(([k, v]) => `<div>${k}</div><div><code>${esc(v)}</code></div>`).join("");
}
const CHECKS = [["embed", "Embeddings"], ["index", "Vector index exists"], ["llm", "Question writer"], ["judge", "Question checker"], ["diagram", "Figure builder"]];
$("#checks").innerHTML = CHECKS.map(([k, n]) => `<div class="check" id="c-${k}"><span class="name">${n}</span><span class="chip">not run</span><span class="res"></span></div>`).join("");
async function runCheck(k) {
  const row = $("#c-" + k); row.querySelector(".chip").className = "chip"; row.querySelector(".chip").textContent = "running…";
  row.querySelector(".res").textContent = "";
  try {
    const r = await api("/api/check?name=" + k);
    row.querySelector(".chip").className = "chip " + (r.ok ? "ok" : "bad");
    row.querySelector(".chip").textContent = r.ok ? "OK" : "failed";
    row.querySelector(".res").textContent = r.ok ? `${r.seconds}s` : `${r.seconds}s · ${r.error}`;
  } catch (e) { row.querySelector(".chip").className = "chip bad"; row.querySelector(".chip").textContent = "failed"; row.querySelector(".res").textContent = e.message; }
}
$("#runChecks").onclick = () => CHECKS.forEach(([k]) => runCheck(k));

// ---------- search
let lastSearch = [];
function drawSearch() {
  $("#sres").replaceChildren(langBar(drawSearch));
  $("#sres").insertAdjacentHTML("beforeend", lastSearch.length ? lastSearch.map(r =>
    qCard(r, `<div class="meta" style="float:right">distance ${r.distance.toFixed(3)} · <code>${esc(r.key)}</code></div>`)).join("") : '<div class="muted">No results.</div>');
  renderMath($("#sres"));
}
$("#sgo").onclick = async () => {
  const q = $("#sq").value.trim(); if (!q) return;
  $("#sgo").disabled = true; $("#sres").innerHTML = '<div class="muted">Searching…</div>';
  try { lastSearch = (await api("/api/search", {query: q, top_k: +$("#sk").value, question_type: $("#st").value})).results; drawSearch(); }
  catch (e) { $("#sres").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  $("#sgo").disabled = false;
};
$("#sq").onkeydown = e => { if (e.key === "Enter") $("#sgo").click(); };

// ---------- generate
let genEvents = [], genFinal = [];
function drawGen() {
  const box = $("#gsteps"); box.innerHTML = "";
  for (const ev of genEvents) {
    const d = ev.data, el = document.createElement("div"); el.className = "step " + ev.node;
    if (ev.node === "retrieve") {
      el.innerHTML = `<h3>1 · Semantic search <span class="meta">${ev.time}</span></h3><div class="meta">Found ${(d.examples || []).length} similar questions in the bank:</div>
        <details><summary>show them</summary>${(d.examples || []).map(e => qCard(e, `<span class="meta" style="float:right">distance ${(+e.distance).toFixed(3)}</span>`)).join("")}</details>`;
    } else if (ev.node === "figures") {
      const made = (d.accepted || []).filter(q => q.diagram_svg);
      const log = d.fig_log || [];
      el.className = "step verify";
      el.innerHTML = `<h3>1b · Diagram questions <span class="meta">${ev.time}</span></h3>
        <div>${made.length} diagram question(s) made.</div>
        ${log.length ? `<div class="meta">${log.map(esc).join("<br>")}</div>` : ""}`;
    } else if (ev.node === "generate") {
      el.innerHTML = `<h3>2 · Writer (round ${d.rounds}) <span class="meta">${ev.time}</span></h3><div class="meta">Drafted ${(d.candidates || []).length} new questions, now being checked.</div>
        <details><summary>show drafts</summary>${(d.candidates || []).map(c => qCard(c)).join("")}</details>`;
    } else if (ev.node === "verify") {
      el.innerHTML = `<h3>3 · Checker <span class="meta">${ev.time}</span></h3><div>${(d.accepted || []).length} verified so far.</div>
        ${d.feedback ? `<div class="meta">Rejected: ${esc(d.feedback)}</div>` : ""}`;
    } else if (ev.node === "finalize") {
      el.innerHTML = `<h3>4 · Done <span class="meta">${ev.time}</span></h3>`;
    }
    box.appendChild(el);
  }
  const fin = $("#gfinal"); fin.replaceChildren();
  if (genFinal.length) {
    fin.appendChild(langBar(drawGen));
    fin.insertAdjacentHTML("beforeend", `<h3 style="margin:6px 0">Generated questions (${genFinal.length})</h3>` + genFinal.map(q => qCard(q)).join(""));
    const b = document.createElement("button"); b.className = "ghost"; b.textContent = "Download JSON";
    b.onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(genFinal, null, 2)], {type: "application/json"})); a.download = "generated.json"; a.click(); };
    fin.appendChild(b);
  }
  renderMath(box); renderMath(fin);
}
$("#ggo").onclick = async () => {
  const topic = $("#gt").value.trim(); if (!topic) return;
  $("#ggo").disabled = true; genEvents = []; genFinal = []; drawGen(); $("#gstatus").textContent = "Running…";
  try {
    const {id} = await api("/api/generate", {topic, n: +$("#gn").value, question_type: $("#gy").value, figures: $("#gf").checked});
    while (true) {
      await new Promise(r => setTimeout(r, 1200));
      const j = await api("/api/job?id=" + id);
      genEvents = j.events;
      const fin = j.events.find(e => e.node === "finalize"); if (fin) genFinal = fin.data.accepted || [];
      drawGen();
      if (j.status === "error") { $("#gstatus").innerHTML = `<div class="err">${esc(j.error)}</div>`; break; }
      if (j.status === "done") { $("#gstatus").textContent = genFinal.length ? "" : "No question passed the checker. Try again or a different topic."; break; }
      $("#gstatus").textContent = "Running… " + (j.events.length ? "last step: " + j.events.at(-1).node : "searching");
    }
  } catch (e) { $("#gstatus").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  $("#ggo").disabled = false;
};

// ---------- index
let indexRows = [];
function drawIndex() {
  $("#ires").replaceChildren(langBar(drawIndex));
  $("#ires").insertAdjacentHTML("beforeend", indexRows.map((q, i) =>
    qCard(q, `<span class="meta" style="float:right">${esc(q.key || "#" + (i + 1))}</span>`)).join(""));
}
$("#iaws").onclick = async () => {
  $("#icount").textContent = "Loading…"; indexRows = [];
  try {
    let token = null;
    do { const r = await api("/api/index" + (token ? "?token=" + encodeURIComponent(token) : "")); indexRows.push(...r.items); token = r.next; $("#icount").textContent = `${indexRows.length} vectors loaded…`; } while (token);
    $("#icount").textContent = `${indexRows.length} vectors in the index`; drawIndex();
  } catch (e) { $("#icount").textContent = ""; $("#ires").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
};
$("#iloc").onclick = async () => {
  try { indexRows = await api("/api/local"); $("#icount").textContent = `${indexRows.length} entries in questions.json (not necessarily embedded yet)`; drawIndex(); }
  catch (e) { $("#ires").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
};

loadCfg();
</script>
</body>
</html>
